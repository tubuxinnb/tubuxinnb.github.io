# Core site settings. Most of the content and style switches can be edited here.
title: "Buxin Tu"
# Shown after the name in the homepage <title>: "Buxin Tu | <tagline>".
tagline: "Ph.D. Student at the University of Pittsburgh"
description: "Personal homepage of Buxin Tu, a Ph.D. student in Computer Science at the University of Pittsburgh."
# Canonical address of the published site. Used for the sitemap, canonical links, and social previews.
url: "https://turbothinking.cn"
baseurl: ""
lang: "en"
timezone: "Asia/Shanghai"
repository: "tubuxinnb/tubuxinnb.github.io"
email: "tubuxin0621@gmail.com"

author:
  name: "Buxin Tu"
  position: "Ph.D. Student in Computer Science"
  affiliation: "University of Pittsburgh"
  department: "Department of Computer Science"
  advisor: "Advisor: Prof. Xulong Tang"
  location: ""
  short_bio: ""
  research_interests:
    - Memory Systems
    - LLM for Arch
    - Near-Data Processing
    - LLM systems

# Visual tuning. The CSS reads these values and applies one of three calibrated modes.
style_mode: "piech" # piech / hewitt / bingyao
font_style: "sans" # serif / sans / mixed
accent_color: "#6f7c8b"

# Section switches. `projects` and `teaching` also control whether their pages are built.
show:
  news: false
  projects: false
  teaching: false
  profile_photo: true
  publication_abstracts: false
  selected_publications_on_home: true
  experience: true
  dark_mode: false

home:
  news_limit: 5
  selected_publications_limit: 3
  project_limit: 2

avatar: "/assets/images/Buxin.jpeg"
logo: "/assets/images/Buxin.jpeg"
# Rendered after "© <year> <name>." in the footer.
footer_text: "Built with Codex and GitHub Pages."

# Keep this list ordered; it is rendered directly in the homepage header.
social_links:
  - label: "GitHub"
    icon: "github"
    url: "https://github.com/tubuxinnb"
  # Add your Google Scholar profile URL here later.
  # - label: "Google Scholar"
  #   url: ""
  # Add X later if you want it to appear in the header.
  # - label: "X"
  #   url: ""

markdown: kramdown
permalink: pretty

kramdown:
  input: GFM
  hard_wrap: false
  syntax_highlighter: rouge

plugins:
  - jekyll-seo-tag
  - jekyll-sitemap

defaults:
  - scope:
      path: ""
    values:
      layout: page
      # Link-preview card. Regenerate it when the name, position, or affiliation changes.
      image:
        path: "/assets/images/og-card.png"
        width: 1200
        height: 630
        alt: "Buxin Tu, Ph.D. Student in Computer Science at the University of Pittsburgh"

sass:
  style: compressed
  sourcemap: development

# Repository tooling that should not be published with the site.
exclude:
  - README.md
  - Dockerfile
  - docker-compose.yml
  - docker
  - Gemfile
  - Gemfile.lock
  - vendor
  - node_modules
